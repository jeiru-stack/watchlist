<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>May &amp; Jay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,450;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
    :root {
        --ink: #14111a;
        --ink-raised: #1e1a24;
        --ink-raised-2: #262030;
        --paper: #f3ede3;
        --paper-dim: #a89d9a;
        --marquee: #e2a33d;
        --marquee-dim: #8a6a34;
        --may: #d97a92;
        --may-soft: rgba(217, 122, 146, 0.14);
        --jay: #6fa998;
        --jay-soft: rgba(111, 169, 152, 0.14);
        --danger: #c25450;
        --star: #f0c14b;
        --shadow: 0 14px 34px rgba(0, 0, 0, 0.55);
        --radius: 10px;
        --font-display: 'Fraunces', Georgia, serif;
        --font-body: 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif;
        --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html {
        scroll-behavior: smooth;
        -webkit-tap-highlight-color: transparent;
        -webkit-overflow-scrolling: touch;
    }

    body {
        background-color: var(--ink);
        color: var(--paper);
        font-family: var(--font-body);
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        min-height: 100vh;
        padding-bottom: var(--safe-bottom);
    }

    ::-webkit-scrollbar {
        width: 4px;
        height: 4px;
    }
    ::-webkit-scrollbar-track {
        background: transparent;
    }
    ::-webkit-scrollbar-thumb {
        background: #3a3444;
        border-radius: 2px;
    }

    .navbar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 1000;
        padding: 16px 32px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        transition: background-color 0.4s ease, padding 0.35s ease;
        background-color: transparent;
        gap: 12px;
    }
    .navbar.scrolled {
        background-color: rgba(20, 17, 26, 0.92);
        padding: 10px 24px;
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        box-shadow: 0 1px 0 rgba(255, 255, 255, 0.05);
    }
    .navbar-left {
        display: flex;
        align-items: center;
        gap: 26px;
        flex-shrink: 0;
    }
    .logo-mark {
        display: flex;
        align-items: center;
        gap: 10px;
        cursor: pointer;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
    }
    .logo-dots {
        position: relative;
        width: 26px;
        height: 20px;
        flex-shrink: 0;
    }
    .logo-dots span {
        position: absolute;
        width: 15px;
        height: 15px;
        border-radius: 50%;
        top: 2px;
        opacity: 0.92;
    }
    .logo-dots span.d-may {
        left: 0;
        background: var(--may);
    }
    .logo-dots span.d-jay {
        left: 10px;
        background: var(--jay);
        mix-blend-mode: screen;
    }
    .logo {
        font-family: var(--font-display);
        font-size: 1.35rem;
        font-weight: 600;
        letter-spacing: -0.2px;
        color: var(--paper);
        white-space: nowrap;
    }
    .nav-links {
        display: flex;
        list-style: none;
        gap: 18px;
        flex-wrap: nowrap;
    }
    .nav-links li a {
        color: var(--paper-dim);
        text-decoration: none;
        font-size: 0.8rem;
        font-weight: 500;
        transition: color var(--transition);
        cursor: pointer;
        position: relative;
        white-space: nowrap;
        padding: 6px 0;
        display: inline-block;
    }
    .nav-links li a:hover,
    .nav-links li a.active {
        color: var(--paper);
    }
    .nav-links li a.active::after {
        content: '';
        position: absolute;
        bottom: -2px;
        left: 0;
        width: 100%;
        height: 2px;
        background: var(--marquee);
        border-radius: 1px;
    }
    .navbar-right {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-shrink: 0;
    }
    .search-box {
        display: flex;
        align-items: center;
        background: rgba(0, 0, 0, 0.35);
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 22px;
        padding: 7px 14px;
        gap: 6px;
        transition: border-color var(--transition), background 0.3s;
    }
    .search-box:focus-within {
        border-color: rgba(226, 163, 61, 0.6);
        background: rgba(0, 0, 0, 0.55);
    }
    .search-box input {
        background: none;
        border: none;
        color: var(--paper);
        font-family: var(--font-body);
        font-size: 0.85rem;
        outline: none;
        width: 110px;
        transition: width 0.3s ease;
        min-width: 0;
    }
    .search-box input:focus {
        width: 150px;
    }
    .search-box input::placeholder {
        color: #7d7580;
    }
    .search-icon {
        font-size: 0.85rem;
        color: #8a8188;
        flex-shrink: 0;
    }
    .icon-btn {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.14);
        background: rgba(0, 0, 0, 0.3);
        color: var(--paper);
        font-size: 1rem;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        transition: transform 0.15s, background 0.2s;
    }
    .icon-btn:hover {
        background: var(--marquee);
        border-color: var(--marquee);
        color: var(--ink);
    }
    .icon-btn:active {
        transform: scale(0.9);
    }
    .avatar-mark {
        position: relative;
        width: 30px;
        height: 22px;
        flex-shrink: 0;
    }
    .avatar-mark span {
        position: absolute;
        width: 17px;
        height: 17px;
        border-radius: 50%;
        top: 2px;
        opacity: 0.95;
    }
    .avatar-mark span.a-may {
        left: 0;
        background: var(--may);
    }
    .avatar-mark span.a-jay {
        left: 11px;
        background: var(--jay);
        mix-blend-mode: screen;
    }

    .hamburger {
        display: none;
        flex-direction: column;
        gap: 5px;
        cursor: pointer;
        z-index: 1100;
        padding: 4px;
        background: none;
        border: none;
        outline: none;
    }
    .hamburger span {
        width: 22px;
        height: 2px;
        background: var(--paper);
        border-radius: 2px;
        transition: all 0.3s ease;
        display: block;
    }
    .hamburger.open span:nth-child(1) {
        transform: rotate(45deg) translate(5px, 5px);
    }
    .hamburger.open span:nth-child(2) {
        opacity: 0;
    }
    .hamburger.open span:nth-child(3) {
        transform: rotate(-45deg) translate(5px, -5px);
    }
    .mobile-nav-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(12, 10, 15, 0.96);
        z-index: 1050;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 26px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.35s ease;
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
    }
    .mobile-nav-overlay.active {
        opacity: 1;
        pointer-events: all;
    }
    .mobile-nav-overlay a {
        color: #cfc7c2;
        font-size: 1.25rem;
        font-weight: 600;
        text-decoration: none;
        letter-spacing: 0.5px;
        transition: color 0.2s;
        font-family: var(--font-display);
    }
    .mobile-nav-overlay a.active-mob {
        color: var(--marquee);
    }
    .mobile-nav-overlay .mob-add {
        color: var(--marquee);
        font-size: 1rem;
        font-family: var(--font-body);
        border: 1px solid var(--marquee);
        padding: 8px 18px;
        border-radius: 20px;
    }

    .hero {
        position: relative;
        height: 72vh;
        min-height: 440px;
        max-height: 720px;
        display: flex;
        align-items: flex-end;
        padding: 0 32px 54px;
        background: linear-gradient(180deg, rgba(20, 17, 26, 0) 0%, rgba(20, 17, 26, 0.35) 38%, rgba(20, 17, 26, 0.86) 72%, var(--ink) 100%),
            linear-gradient(90deg, rgba(20, 17, 26, 0.7) 0%, rgba(20, 17, 26, 0.2) 50%, rgba(20, 17, 26, 0.05) 100%),
            #1c1922;
        background-size: contain;
        background-position: center;
        background-repeat: no-repeat;
        transition: background-image 0.5s ease;
    }
    .hero-content {
        max-width: 540px;
        z-index: 2;
        animation: fadeInUp 0.7s ease forwards;
    }
    @keyframes fadeInUp {
        from {
            opacity: 0;
            transform: translateY(28px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
    .hero-eyebrow {
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 2.2px;
        text-transform: uppercase;
        color: var(--marquee);
        margin-bottom: 10px;
    }
    .hero-title {
        font-family: var(--font-display);
        font-size: 2.7rem;
        font-weight: 600;
        letter-spacing: -0.5px;
        margin-bottom: 10px;
        text-shadow: 0 2px 14px rgba(0, 0, 0, 0.7);
        line-height: 1.08;
    }
    .hero-meta {
        display: flex;
        gap: 14px;
        align-items: center;
        margin-bottom: 12px;
        font-size: 0.85rem;
        color: #d8d0d4;
        flex-wrap: wrap;
    }
    .hero-stars {
        color: var(--star);
        font-size: 1.05rem;
        letter-spacing: 1px;
    }
    .hero-scheduled-chip {
        color: var(--marquee);
        font-weight: 600;
    }
    .hero-description {
        font-size: 0.92rem;
        line-height: 1.6;
        color: #c6bfc3;
        margin-bottom: 20px;
        display: -webkit-box;
        -webkit-box-orient: vertical;
        overflow: hidden;
        -webkit-line-clamp: 3;
    }
    .hero-buttons {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
    }
    .btn {
        font-family: var(--font-body);
        font-size: 0.85rem;
        font-weight: 600;
        border: none;
        cursor: pointer;
        border-radius: 24px;
        padding: 11px 22px;
        transition: transform 0.15s ease, filter 0.2s ease;
        -webkit-tap-highlight-color: transparent;
    }
    .btn:active {
        transform: scale(0.96);
    }
    .btn-primary {
        background: var(--marquee);
        color: #201705;
    }
    .btn-primary:hover {
        filter: brightness(1.08);
    }
    .btn-ghost {
        background: rgba(255, 255, 255, 0.08);
        color: var(--paper);
        border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .btn-ghost:hover {
        background: rgba(255, 255, 255, 0.15);
    }
    .btn-danger-ghost {
        background: transparent;
        color: var(--danger);
        border: 1px solid rgba(194, 84, 80, 0.5);
    }
    .btn-danger-ghost:hover {
        background: rgba(194, 84, 80, 0.12);
    }
    .hero-fade-bottom {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 90px;
        background: linear-gradient(transparent, var(--ink));
        pointer-events: none;
        z-index: 1;
    }

    .main-content {
        margin-top: -54px;
        position: relative;
        z-index: 5;
        padding-bottom: 50px;
        min-height: 30vh;
    }
    .category-section {
        margin-bottom: 30px;
        padding: 0 32px;
    }
    .category-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 10px;
    }
    .category-title {
        font-family: var(--font-display);
        font-size: 1.3rem;
        font-weight: 600;
        color: var(--paper);
        cursor: default;
    }
    .category-row {
        display: flex;
        gap: 12px;
        overflow-x: auto;
        padding: 8px 2px 16px;
        scroll-behavior: smooth;
        -ms-overflow-style: none;
        scrollbar-width: none;
        -webkit-overflow-scrolling: touch;
        scroll-snap-type: x proximity;
    }
    .category-row::-webkit-scrollbar {
        display: none;
    }

    .empty-state {
        text-align: center;
        padding: 70px 20px;
    }
    .empty-state h2 {
        font-family: var(--font-display);
        font-size: 1.3rem;
        font-weight: 600;
        margin-bottom: 8px;
        color: var(--paper);
    }
    .empty-state p {
        color: var(--paper-dim);
        font-size: 0.88rem;
    }

    .card {
        flex: 0 0 auto;
        width: 175px;
        border-radius: 8px;
        overflow: hidden;
        background: var(--ink-raised);
        cursor: pointer;
        transition: box-shadow 0.3s ease, transform 0.2s ease;
        position: relative;
        z-index: 1;
        scroll-snap-align: start;
        user-select: none;
    }
    .card:active {
        transform: scale(0.97);
        transition: transform 0.1s ease;
    }
    .card:hover {
        box-shadow: var(--shadow);
        z-index: 100;
    }
    .card-poster-wrapper {
        overflow: hidden;
        border-radius: 8px 8px 0 0;
        line-height: 0;
        aspect-ratio: 2/3;
        background: var(--ink-raised-2);
    }
    .card-poster {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .card:hover .card-poster {
        transform: scale(1.1);
    }
    .card-info {
        padding: 10px 10px 12px;
        background: var(--ink-raised);
        border-radius: 0 0 8px 8px;
    }
    .card-title {
        font-size: 0.8rem;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        line-height: 1.2;
    }
    .card-stars {
        color: var(--star);
        font-size: 0.78rem;
        letter-spacing: 0.5px;
        margin-top: 4px;
    }
    .card-meta {
        font-size: 0.68rem;
        color: var(--paper-dim);
        display: flex;
        gap: 6px;
        align-items: center;
        margin-top: 4px;
        flex-wrap: wrap;
    }
    .card-type-badge {
        position: absolute;
        top: 7px;
        left: 7px;
        padding: 2px 7px;
        border-radius: 4px;
        font-size: 0.6rem;
        font-weight: 700;
        letter-spacing: 0.6px;
        text-transform: uppercase;
        background: rgba(0, 0, 0, 0.75);
        z-index: 10;
        opacity: 0;
        transition: opacity var(--transition);
    }
    .card:hover .card-type-badge {
        opacity: 1;
    }
    .schedule-badge {
        display: inline-block;
        background: var(--ink-raised-2);
        color: var(--marquee);
        font-size: 0.62rem;
        padding: 2px 7px;
        border-radius: 10px;
        margin-top: 4px;
        white-space: nowrap;
    }
    .mini-ratings {
        display: flex;
        gap: 6px;
        margin-top: 5px;
    }
    .mini-ratings span {
        font-size: 0.62rem;
        font-weight: 700;
        padding: 1px 6px;
        border-radius: 8px;
        letter-spacing: 0.3px;
    }
    .mini-may {
        background: var(--may-soft);
        color: var(--may);
    }
    .mini-jay {
        background: var(--jay-soft);
        color: var(--jay);
    }

    .modal-overlay {
        position: fixed;
        inset: 0;
        z-index: 2000;
        background: rgba(8, 6, 10, 0.9);
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s ease;
        padding: 16px;
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
    }
    .modal-overlay.active {
        opacity: 1;
        pointer-events: all;
    }
    .modal {
        background: var(--ink-raised);
        border-radius: 14px;
        width: 100%;
        max-width: 640px;
        max-height: 88vh;
        overflow-y: auto;
        box-shadow: 0 20px 55px rgba(0, 0, 0, 0.8);
        position: relative;
        animation: modalIn 0.3s ease;
        -webkit-overflow-scrolling: touch;
    }
    @keyframes modalIn {
        from {
            transform: scale(0.94);
            opacity: 0;
        }
        to {
            transform: scale(1);
            opacity: 1;
        }
    }
    .modal-close {
        position: sticky;
        top: 12px;
        float: right;
        margin-right: 12px;
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: rgba(0, 0, 0, 0.55);
        border: none;
        color: var(--paper);
        font-size: 1.1rem;
        cursor: pointer;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.2s;
    }
    .modal-close:hover {
        background: var(--danger);
    }
    .modal-close:active {
        transform: scale(0.9);
    }
    .modal-poster {
        width: 100%;
        height: 240px;
        object-fit: contain;
        border-radius: 14px 14px 0 0;
        background: var(--ink-raised-2);
        display: block;
    }
    .modal-body {
        padding: 22px 24px 28px;
    }
    .modal-title {
        font-family: var(--font-display);
        font-size: 1.6rem;
        font-weight: 600;
        margin-bottom: 6px;
        line-height: 1.2;
    }
    .modal-meta {
        display: flex;
        gap: 12px;
        align-items: center;
        margin-bottom: 14px;
        font-size: 0.82rem;
        color: #cfc7c2;
        flex-wrap: wrap;
    }
    .modal-stars {
        color: var(--star);
        font-size: 1.15rem;
        letter-spacing: 1px;
    }
    .modal-description {
        color: #cdc5c0;
        line-height: 1.65;
        margin-bottom: 20px;
        font-size: 0.9rem;
    }

    .sync-meter {
        background: var(--ink-raised-2);
        border-radius: 10px;
        padding: 14px 16px;
        margin-bottom: 20px;
    }
    .sync-track {
        position: relative;
        height: 6px;
        border-radius: 3px;
        background: linear-gradient(90deg, rgba(217, 122, 146, 0.25), rgba(111, 169, 152, 0.25));
        margin-bottom: 10px;
    }
    .sync-dot {
        position: absolute;
        top: 50%;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        transform: translate(-50%, -50%);
        box-shadow: 0 0 0 3px var(--ink-raised-2);
    }
    .sync-may {
        background: var(--may);
    }
    .sync-jay {
        background: var(--jay);
    }
    .sync-caption {
        font-size: 0.82rem;
        color: var(--paper-dim);
        text-align: center;
    }

    .note-card {
        background: var(--ink-raised-2);
        border-radius: 10px;
        padding: 14px;
        border-top: 3px solid;
    }
    .note-may {
        border-color: var(--may);
    }
    .note-jay {
        border-color: var(--jay);
    }
    .note-card-head {
        font-family: var(--font-display);
        font-weight: 600;
        font-size: 1rem;
        margin-bottom: 8px;
    }
    .note-may .note-card-head {
        color: var(--may);
    }
    .note-jay .note-card-head {
        color: var(--jay);
    }
    .existing-ratings {
        display: flex;
        gap: 14px;
        margin-bottom: 18px;
        flex-wrap: wrap;
    }
    .existing-ratings .note-card {
        flex: 1;
        min-width: 140px;
    }
    .existing-ratings .note-card p {
        font-size: 0.82rem;
        color: #cdc5c0;
        margin-top: 4px;
        line-height: 1.4;
    }

    .planned-date-display {
        font-size: 0.85rem;
        color: var(--marquee);
        margin-bottom: 18px;
        display: flex;
        align-items: center;
        gap: 6px;
    }

    .modal-actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 6px;
    }

    .surprise-box {
        background: var(--ink-raised);
        border-radius: 16px;
        padding: 30px 26px;
        text-align: center;
        max-width: 320px;
        box-shadow: var(--shadow);
    }
    .surprise-img-wrap {
        width: 160px;
        height: 240px;
        margin: 0 auto 18px;
        border-radius: 8px;
        overflow: hidden;
        background: var(--ink-raised-2);
        box-shadow: 0 10px 26px rgba(0, 0, 0, 0.5);
    }
    .surprise-img-wrap img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
    }
    .surprise-text {
        font-family: var(--font-display);
        font-size: 1.05rem;
        font-weight: 600;
        color: var(--paper);
        margin-bottom: 4px;
    }
    .surprise-sub {
        font-size: 0.8rem;
        color: var(--paper-dim);
    }

    @media (max-width: 1024px) {
        .navbar {
            padding: 12px 20px;
        }
        .navbar.scrolled {
            padding: 8px 16px;
        }
        .nav-links {
            gap: 12px;
        }
        .nav-links li a {
            font-size: 0.75rem;
        }
        .hero {
            height: 58vh;
            min-height: 360px;
            padding: 0 20px 42px;
        }
        .hero-title {
            font-size: 2.1rem;

                banner: 'https://m.media-amazon.com/images/M/MV5BODAwNTY3Nzk4NF5BMl5BanBnXkFtZTgwMDY4MTQyMzE@._V1_QL75_UX1000_CR0,0,1000,563_.jpg',
                description: 'The husband of a missing woman becomes the main suspect in her disappearance.',
                plannedDate: null, 
                watched: { may: { rating: 10.0, comment: 'Nick just mess up with the wrong girl The way Amy take revenge on her cheating husband 😣' }, jay: { rating: 10.0, comment: 'Its so good that i hated it Great movie' } }
            }
        ];

        let categoryOrder = ['Action', 'Sci-Fi', 'Drama', 'Horror', 'Comedy', 'Anime', 'Thriller', 'Romance'];
        let items = [];
        let currentFilter = 'all';
        let currentModalItem = null;
        let mobileMenuOpen = false;
        let surpriseTimer = null;

        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            return String(str).replace(/[&<>"']/g, function(ch) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
            });
        }

        function getAverageRating(item) {
            const allRatings = [];
            if (item.watched) {
                if (item.watched.may) allRatings.push(item.watched.may.rating);
                if (item.watched.jay) allRatings.push(item.watched.jay.rating);
            }
            if (allRatings.length > 0) {
                const avg = allRatings.reduce((a, b) => a + b, 0) / allRatings.length;
                return Math.round(avg * 2) / 2;
            }
            return 0;
        }

        function ratingToStars(rating) {
            const full = Math.floor(rating / 2);
            const half = rating % 2 >= 0.5 ? 1 : 0;
            const empty = 5 - full - half;
            return '★'.repeat(full) + (half ? '½' : '') + (empty > 0 ? '☆'.repeat(empty) : '');
        }

        function formatPlannedDate(iso) {
            if (!iso) return '';
            const d = new Date(iso + 'T00:00:00');
            if (isNaN(d.getTime())) return '';
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const diffDays = Math.round((d - today) / 86400000);
            const dateStr = d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
            if (diffDays === 0) return 'Today \u00b7 ' + dateStr;
            if (diffDays === 1) return 'Tomorrow \u00b7 ' + dateStr;
            if (diffDays > 1 && diffDays <= 7) return 'In ' + diffDays + ' days \u00b7 ' + dateStr;
            if (diffDays < 0) return dateStr + ' (past)';
            return dateStr;
        }

        async function loadItems() {
            try {
                if (window.storage) {
                    const result = await window.storage.get(STORAGE_KEY, true);
                    if (result && result.value) {
                        items = JSON.parse(result.value);
                        return;
                    }
                }
            } catch (e) {
                console.warn('No saved library found yet, starting with defaults.', e);
            }
            items = seedItems.map(i => Object.assign({}, i));
            await persistItems();
        }

        async function persistItems() {
            try {
                if (window.storage) {
                    await window.storage.set(STORAGE_KEY, JSON.stringify(items), true);
                }
            } catch (e) {
                console.error('Could not save library changes.', e);
            }
        }

        function ensureAllCategories() {
            items.forEach(i => { if (!categoryOrder.includes(i.category)) categoryOrder.push(i.category); });
        }

        async function init() {
            await loadItems();
            ensureAllCategories();
            refreshHero();
            renderAllCategories();

            document.getElementById('heroDetailsBtn').addEventListener('click', () => {
                if (currentHeroItemId !== null) openDetail(currentHeroItemId);
            });
            document.getElementById('heroSurpriseBtn').addEventListener('click', surprisePick);

            window.addEventListener('scroll', () => {
                document.getElementById('navbar').classList.toggle('scrolled', window.scrollY > 40);
            });
            window.addEventListener('resize', () => {
                if (window.innerWidth > 768 && mobileMenuOpen) closeMobileMenu();
            });
        }

        function toggleMobileMenu() {
            const hamburger = document.getElementById('hamburger');
            const overlay = document.getElementById('mobileNavOverlay');
            mobileMenuOpen = !mobileMenuOpen;
            if (mobileMenuOpen) {
                hamburger.classList.add('open');
                overlay.classList.add('active');
                document.body.style.overflow = 'hidden';
            } else {
                closeMobileMenu();
            }
        }
        function closeMobileMenu() {
            mobileMenuOpen = false;
            document.getElementById('hamburger').classList.remove('open');
            document.getElementById('mobileNavOverlay').classList.remove('active');
            document.body.style.overflow = '';
        }
        function mobileNavSelect(filter, linkElement) {
            closeMobileMenu();
            filterContent(filter, null);
            document.querySelectorAll('#mobileNavOverlay a').forEach(a => a.classList.remove('active-mob'));
            if (linkElement) linkElement.classList.add('active-mob');
            document.querySelectorAll('.nav-links li a').forEach(a => {
                a.classList.remove('active');
                if (a.getAttribute('data-filter') === filter) a.classList.add('active');
            });
        }
        document.addEventListener('DOMContentLoaded', () => {
            const overlay = document.getElementById('mobileNavOverlay');
            if (overlay) overlay.addEventListener('click', function(e) { if (e.target === this) closeMobileMenu(); });
        });

        let currentHeroItemId = null;
        function pickHeroItem() {
            const upcoming = items.filter(i => !i.watched && i.plannedDate)
                .sort((a, b) => new Date(a.plannedDate) - new Date(b.plannedDate));
            if (upcoming.length) return { item: upcoming[0], reason: 'scheduled' };
            const watchedItems = items.filter(i => i.watched);
            if (watchedItems.length) {
                const best = watchedItems.slice().sort((a, b) => getAverageRating(b) - getAverageRating(a))[0];
                return { item: best, reason: 'favorite' };
            }
            if (items.length) return { item: items[0], reason: 'default' };
            return { item: null, reason: 'none' };
        }
        function refreshHero() {
            const { item, reason } = pickHeroItem();
            if (!item) {
                currentHeroItemId = null;
                document.getElementById('heroEyebrow').textContent = 'YOUR LIBRARY';
                document.getElementById('heroTitle').textContent = 'Nothing here yet';
                document.getElementById('heroStars').textContent = '';
                document.getElementById('heroYear').textContent = '';
                document.getElementById('heroDuration').textContent = '';
                document.getElementById('heroDescription').textContent = 'Add your first title to get started.';
                document.getElementById('hero').style.backgroundImage = '';
                return;
            }
            currentHeroItemId = item.id;
            const avg = getAverageRating(item);
            const eyebrow = document.getElementById('heroEyebrow');
            if (reason === 'scheduled') eyebrow.textContent = 'NEXT MOVIE NIGHT \u00b7 ' + formatPlannedDate(item.plannedDate).toUpperCase();
            else if (reason === 'favorite') eyebrow.textContent = 'AN OLD FAVORITE OF OURS';
            else eyebrow.textContent = 'FROM THE LIBRARY';
            document.getElementById('heroTitle').textContent = item.title;
            document.getElementById('heroStars').textContent = ratingToStars(avg) || '☆☆☆☆☆';
            document.getElementById('heroYear').textContent = item.year;
            document.getElementById('heroDuration').textContent = item.duration;
            document.getElementById('heroDescription').textContent = item.description;
            const banner = item.banner || item.poster || '';
            document.getElementById('hero').style.backgroundImage =
                "linear-gradient(180deg, rgba(20,17,26,0) 0%, rgba(20,17,26,0.35) 38%, rgba(20,17,26,0.86) 72%, #14111a 100%), " +
                "linear-gradient(90deg, rgba(20,17,26,0.7) 0%, rgba(20,17,26,0.2) 50%, rgba(20,17,26,0.05) 100%), " +
                "url('" + banner.replace(/'/g, "%27") + "')";
            const heroContent = document.getElementById('heroContent');
            heroContent.style.animation = 'none';
            void heroContent.offsetHeight;
            heroContent.style.animation = 'fadeInUp 0.7s ease forwards';
        }

        function createCardHTML(item, showBadge) {
            const avg = getAverageRating(item);
            const stars = ratingToStars(avg);
            const typeLabel = item.type === 'movie' ? 'Movie' : 'Series';
            let badge = '';
            if (showBadge && item.plannedDate) badge = '<span class="schedule-badge">\uD83D\uDCC5 ' + escapeHtml(formatPlannedDate(item.plannedDate)) + '</span>';
            let miniRatings = '';
            if (item.watched) {
                const mayR = item.watched.may ? item.watched.may.rating.toFixed(1) : '\u2013';
                const jayR = item.watched.jay ? item.watched.jay.rating.toFixed(1) : '\u2013';
                miniRatings = '<div class="mini-ratings"><span class="mini-may">M ' + mayR + '</span><span class="mini-jay">J ' + jayR + '</span></div>';
            }
            return '' +
                '<div class="card" data-id="' + item.id + '">' +
                '<div class="card-poster-wrapper"><img class="card-poster" src="' + escapeHtml(item.poster) + '" alt="' + escapeHtml(item.title) + '" loading="lazy" onerror="this.onerror=null;this.src=PLACEHOLDER_POSTER;"></div>' +
                '<span class="card-type-badge">' + typeLabel + '</span>' +
                '<div class="card-info">' +
                '<div class="card-title">' + escapeHtml(item.title) + '</div>' +
                '<div class="card-stars">' + (stars || '☆☆☆☆☆') + '</div>' +
                miniRatings +
                '<div class="card-meta"><span>' + item.year + '</span>' + badge + '</div>' +
                '</div>' +
                '</div>';
        }

        function renderCategoryHTML(categoryName, list, showBadge) {
            const cards = list.map(item => createCardHTML(item, showBadge)).join('');
            return '<div class="category-section"><div class="category-header"><span class="category-title">' + escapeHtml(categoryName) + '</span></div><div class="category-row">' + cards + '</div></div>';
        }

        function emptyState(title, sub) {
            return '<div class="empty-state"><h2>' + escapeHtml(title) + '</h2><p>' + escapeHtml(sub) + '</p></div>';
        }

        function groupByCategory(list, showBadge) {
            const grouped = {};
            list.forEach(i => { if (!grouped[i.category]) grouped[i.category] = []; grouped[i.category].push(i); });
            let html = '';
            const seen = new Set();
            categoryOrder.forEach(cat => {
                if (grouped[cat] && grouped[cat].length) { html += renderCategoryHTML(cat, grouped[cat], showBadge);
                    seen.add(cat); }
            });
            Object.keys(grouped).forEach(cat => {
                if (!seen.has(cat) && grouped[cat].length) html += renderCategoryHTML(cat, grouped[cat], showBadge);
            });
            return html;
        }

        function renderWatchlistHTML(list) {
            const unwatched = list.filter(i => !i.watched);
            const scheduled = unwatched.filter(i => i.plannedDate).sort((a, b) => new Date(a.plannedDate) - new Date(b.plannedDate));
            const someday = unwatched.filter(i => !i.plannedDate);
            let html = '';
            if (scheduled.length) html += renderCategoryHTML('Coming Up', scheduled, true);
            if (someday.length) html += renderCategoryHTML('Someday', someday, false);
            return html || emptyState('Nothing on the watchlist yet', 'Open any title and set a planned date, or add something new.');
        }

        function renderAllCategories() {
            const container = document.getElementById('mainContent');
            if (currentFilter === 'watchlist') {
                container.innerHTML = renderWatchlistHTML(items);
                return;
            }
            if (currentFilter === 'alreadyWatched') {
                const watchedItems = items.filter(i => i.watched);
                container.innerHTML = groupByCategory(watchedItems, false) || emptyState('No watched titles yet', "Open a title and log a rating once you've watched it together.");
                return;
            }
            const filtered = items.filter(i => currentFilter === 'all' || i.type === currentFilter);
            container.innerHTML = groupByCategory(filtered, false) || emptyState('Nothing here yet', 'Try a different filter, or add something new.');
        }

        function filterContent(filter, linkElement) {
            currentFilter = filter;
            document.querySelectorAll('.nav-links li a').forEach(a => a.classList.remove('active'));
            if (linkElement) linkElement.classList.add('active');
            document.querySelectorAll('#mobileNavOverlay a').forEach(a => {
                a.classList.remove('active-mob');
                if (a.getAttribute('data-filter') === filter) a.classList.add('active-mob');
            });
            document.getElementById('searchInput').value = '';
            renderAllCategories();
            document.getElementById('mainContent').scrollIntoView({ behavior: 'smooth', block: 'start' });
            closeMobileMenu();
        }

        function handleSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            if (!query) { renderAllCategories(); return; }
            let filtered = items.filter(i => i.title.toLowerCase().includes(query));
            if (currentFilter === 'movie' || currentFilter === 'series') filtered = filtered.filter(i => i.type === currentFilter);
            else if (currentFilter === 'alreadyWatched') filtered = filtered.filter(i => i.watched);
            else if (currentFilter === 'watchlist') filtered = filtered.filter(i => !i.watched);
            const container = document.getElementById('mainContent');
            if (!filtered.length) { container.innerHTML = emptyState('No results', 'Nothing matches "' + document.getElementById('searchInput').value.trim() + '".'); return; }
            if (currentFilter === 'watchlist') container.innerHTML = renderWatchlistHTML(filtered);
            else container.innerHTML = renderCategoryHTML('Search Results', filtered, false);
        }

        document.addEventListener('click', (e) => {
            const card = e.target.closest('.card');
            if (card && document.getElementById('mainContent').contains(card)) {
                openDetail(Number(card.dataset.id));
            }
        });

        function buildSyncMeterHTML(mayRating, jayRating) {
            const delta = Math.abs(mayRating - jayRating);
            let caption;
            if (delta === 0) caption = 'Perfectly in sync \uD83C\uDFAF';
            else if (delta <= 1) caption = 'Practically twins \uD83E\uDD1D';
            else if (delta <= 2.5) caption = 'A little different taste \uD83C\uDFAC';
            else caption = 'Totally different wavelengths \uD83D\uDCE1';
            const mayPos = (mayRating / 10 * 100).toFixed(1);
            const jayPos = (jayRating / 10 * 100).toFixed(1);
            return '' +
                '<div class="sync-meter">' +
                '<div class="sync-track"><span class="sync-dot sync-may" style="left:' + mayPos + '%"></span><span class="sync-dot sync-jay" style="left:' + jayPos + '%"></span></div>' +
                '<div class="sync-caption">' + caption + '</div>' +
                '</div>';
        }

        function buildModalBodyHTML(item) {
            const avg = getAverageRating(item);
            const typeLabel = item.type === 'movie' ? 'Movie' : 'Series';
            let sync = '';
            let existingRatingsHtml = '';
            if (item.watched) {
                if (item.watched.may && item.watched.jay) {
                    sync = buildSyncMeterHTML(item.watched.may.rating, item.watched.jay.rating);
                }
                existingRatingsHtml = '<div class="existing-ratings">';
                if (item.watched.may) {
                    existingRatingsHtml += '<div class="note-card note-may"><div class="note-card-head">May ★ ' + item.watched.may.rating.toFixed(1) + '</div>';
                    if (item.watched.may.comment) existingRatingsHtml += '<p>' + escapeHtml(item.watched.may.comment) + '</p>';
                    existingRatingsHtml += '</div>';
                }
                if (item.watched.jay) {
                    existingRatingsHtml += '<div class="note-card note-jay"><div class="note-card-head">Jay ★ ' + item.watched.jay.rating.toFixed(1) + '</div>';
                    if (item.watched.jay.comment) existingRatingsHtml += '<p>' + escapeHtml(item.watched.jay.comment) + '</p>';
                    existingRatingsHtml += '</div>';
                }
                existingRatingsHtml += '</div>';
            }
            let plannedDateHtml = '';
            if (item.plannedDate) {
                plannedDateHtml = '<div class="planned-date-display">📅 ' + escapeHtml(formatPlannedDate(item.plannedDate)) + '</div>';
            }
            return '' +
                '<h2 class="modal-title">' + escapeHtml(item.title) + '</h2>' +
                '<div class="modal-meta">' +
                '<span class="modal-stars">' + (ratingToStars(avg) || '☆☆☆☆☆') + '</span>' +
                '<span>' + item.year + '</span><span>' + escapeHtml(item.duration) + '</span><span>' + typeLabel + '</span>' +
                '</div>' +
                '<p class="modal-description">' + escapeHtml(item.description) + '</p>' +
                '<div id="syncMeterSlot">' + sync + '</div>' +
                existingRatingsHtml +
                plannedDateHtml +
                '<div class="modal-actions">' +
                '</div>';
        }

        function wireModalForm(item) {
        }

        function openDetail(id) {
            const item = items.find(i => i.id === id);
            if (!item) return;
            currentModalItem = item;
            document.getElementById('modalPoster').src = item.banner || item.poster || PLACEHOLDER_BANNER;
            document.getElementById('modalPoster').alt = item.title;
            document.getElementById('modalBody').innerHTML = buildModalBodyHTML(item);
            wireModalForm(item);
            const overlay = document.getElementById('modalOverlay');
            overlay.classList.add('active');
            document.body.style.overflow = 'hidden';
            document.getElementById('modal').scrollTop = 0;
        }

        async function confirmRemoveItem(id) {
            const item = items.find(i => i.id === id);
            if (!item) return;
            const ok = confirm('Remove "' + item.title + '" from your library? This can\u2019t be undone.');
            if (!ok) return;
            items = items.filter(i => i.id !== id);
            await persistItems();
            closeModal();
            renderAllCategories();
            refreshHero();
        }

        function closeModal(e) {
            if (e && e.target !== document.getElementById('modalOverlay')) return;
            document.getElementById('modalOverlay').classList.remove('active');
            document.body.style.overflow = '';
            currentModalItem = null;
        }

        function buildAddFormHTML() {
            const catOptions = categoryOrder.map(c => '<option value="' + escapeHtml(c) + '">').join('');
            return '' +
                '<h2 class="modal-title">Add a title</h2>' +
                '<p class="form-hint" style="margin-bottom:18px;">Add something new to your shared library.</p>' +
                '<div class="form-grid">' +
                '<div class="form-section"><label class="form-label" for="addTitleInput">Title</label><input type="text" class="form-input" id="addTitleInput" placeholder="e.g. Past Lives"></div>' +
                '<div class="form-section"><label class="form-label" for="addTypeInput">Type</label><select class="form-input" id="addTypeInput"><option value="movie">Movie</option><option value="series">Series</option></select></div>' +
                '<div class="form-section"><label class="form-label" for="addCategoryInput">Category</label><input type="text" class="form-input" id="addCategoryInput" list="categoryOptions" placeholder="e.g. Drama"><datalist id="categoryOptions">' + catOptions + '</datalist></div>' +
                '<div class="form-section"><label class="form-label" for="addYearInput">Year</label><input type="number" class="form-input" id="addYearInput" placeholder="2026"></div>' +
                '<div class="form-section"><label class="form-label" for="addDurationInput">Duration</label><input type="text" class="form-input" id="addDurationInput" placeholder="e.g. 1h 45m"></div>' +
                '<div class="form-section full"><label class="form-label" for="addPosterInput">Poster image URL</label><input type="text" class="form-input" id="addPosterInput" placeholder="https://..."></div>' +
                '<div class="form-section full"><label class="form-label" for="addBannerInput">Banner image URL (optional)</label><input type="text" class="form-input" id="addBannerInput" placeholder="https://..."></div>' +
                '<div class="form-section full"><label class="form-label" for="addDescriptionInput">Description</label><textarea class="form-input" id="addDescriptionInput" maxlength="400" placeholder="What is it about?"></textarea></div>' +
                '</div>' +
                '<div class="modal-actions"><button class="btn btn-primary" id="addSubmitBtn" type="button">Add to library</button></div>';
        }

        function wireAddForm() {
            document.getElementById('addSubmitBtn').addEventListener('click', submitAddForm);
        }

        async function submitAddForm() {
            const titleInput = document.getElementById('addTitleInput');
            const title = titleInput.value.trim();
            if (!title) { titleInput.focus();
                titleInput.style.borderColor = 'var(--danger)'; return; }
            const type = document.getElementById('addTypeInput').value;
            const category = document.getElementById('addCategoryInput').value.trim() || 'Uncategorized';
            const yearVal = parseInt(document.getElementById('addYearInput').value, 10);
            const year = isNaN(yearVal) ? new Date().getFullYear() : yearVal;
            const duration = document.getElementById('addDurationInput').value.trim() || '\u2014';
            const poster = document.getElementById('addPosterInput').value.trim();
            const banner = document.getElementById('addBannerInput').value.trim();
            const description = document.getElementById('addDescriptionInput').value.trim() || 'No description yet.';

            const newItem = {
                id: items.reduce((max, i) => Math.max(max, i.id), 0) + 1,
                title,
                type,
                category,
                year,
                duration,
                poster: poster || PLACEHOLDER_POSTER,
                banner: banner || poster || PLACEHOLDER_BANNER,
                description,
                plannedDate: null,
                watched: null
            };
            items.push(newItem);
            if (!categoryOrder.includes(category)) categoryOrder.push(category);
            await persistItems();
            closeModal();
            renderAllCategories();
            refreshHero();
        }

        function openAddForm() {
            currentModalItem = null;
            document.getElementById('modalPoster').src = PLACEHOLDER_POSTER;
            document.getElementById('modalPoster').alt = 'New title';
            document.getElementById('modalBody').innerHTML = buildAddFormHTML();
            wireAddForm();
            const overlay = document.getElementById('modalOverlay');
            overlay.classList.add('active');
            document.body.style.overflow = 'hidden';
            document.getElementById('modal').scrollTop = 0;
            closeMobileMenu();
        }

        function surprisePick() {
            let pool = items.filter(i => !i.watched);
            let usingFallback = false;
            if (!pool.length) { pool = items.slice();
                usingFallback = true; }
            if (!pool.length) return;

            const finalItem = pool[Math.floor(Math.random() * pool.length)];
            const overlay = document.getElementById('surpriseOverlay');
            const img = document.getElementById('surpriseImg');
            const text = document.getElementById('surpriseText');
            const sub = document.getElementById('surpriseSub');
            text.textContent = 'Picking something for tonight\u2026';
            sub.textContent = 'Hold tight';
            overlay.classList.add('active');
            document.body.style.overflow = 'hidden';

            let ticks = 0;
            const maxTicks = 14;
            if (surpriseTimer) clearInterval(surpriseTimer);
            surpriseTimer = setInterval(() => {
                ticks++;
                const randomItem = pool[Math.floor(Math.random() * pool.length)];
                img.src = randomItem.poster || PLACEHOLDER_POSTER;
                if (ticks >= maxTicks) {
                    clearInterval(surpriseTimer);
                    img.src = finalItem.poster || PLACEHOLDER_POSTER;
                    text.textContent = finalItem.title;
                    sub.textContent = usingFallback ? 'You\u2019ve seen it all \u2014 here\u2019s an old favorite' : 'Tonight\u2019s pick';
                    setTimeout(() => {
                        overlay.classList.remove('active');
                        document.body.style.overflow = '';
                        openDetail(finalItem.id);
                    }, 900);
                }
            }, 90);
        }

        function closeSurprise(e) {
            if (e && e.target !== document.getElementById('surpriseOverlay')) return;
            if (surpriseTimer) clearInterval(surpriseTimer);
            document.getElementById('surpriseOverlay').classList.remove('active');
            document.body.style.overflow = '';
        }

        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') {
                if (document.getElementById('modalOverlay').classList.contains('active')) closeModal();
                else if (document.getElementById('surpriseOverlay').classList.contains('active')) closeSurprise({ target: document.getElementById('surpriseOverlay') });
                else if (mobileMenuOpen) closeMobileMenu();
            }
            if ((e.key === '/' || (e.ctrlKey && e.key === 'f')) && document.activeElement !== document.getElementById('searchInput')) {
                e.preventDefault();
                document.getElementById('searchInput').focus();
            }
        });

        init();
    </script>
</body>
</html>
